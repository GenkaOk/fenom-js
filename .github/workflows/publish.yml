name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - fenom-js
          - vite-plugin-fenom
          - both

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: |
          pnpm "build: all"

      - run: |
          pnpm "build: copy-metafiles"

      - name: Publish fenom-js
        if: ${{ github.event_name == 'release' || github.event.inputs.package == 'fenom-js' || github.event.inputs.package == 'both' }}
        run: npm publish --access public
        working-directory: build/fenom-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish vite-plugin-fenom
        if: ${{ github.event_name == 'release' || github.event.inputs.package == 'vite-plugin-fenom' || github.event.inputs.package == 'both' }}
        run: npm publish --access public
        working-directory: build/vite-plugin-fenom
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
