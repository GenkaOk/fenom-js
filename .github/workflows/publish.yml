name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - fenom-js
          - vite-plugin-fenom
          - both

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - run: pnpm install --frozen-lockfile

      - run: |
          pnpm "build: all"

      - run: |
          pnpm "build: copy-metafiles"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Publish fenom-js
        if: ${{ github.event_name == 'push' || github.event.inputs.package == 'fenom-js' || github.event.inputs.package == 'both' }}
        run: npm publish --access public
        working-directory: build/fenom-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish vite-plugin-fenom
        if: ${{ github.event_name == 'push' || github.event.inputs.package == 'vite-plugin-fenom' || github.event.inputs.package == 'both' }}
        run: npm publish --access public
        working-directory: build/vite-plugin-fenom
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
